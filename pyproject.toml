description = "Reproducible experiments for progressive chess outcome prediction."
requires-python = ">=3.11,<3.12"
dependencies = [
    "ipykernel>=6.29,<8",
    "jupyterlab>=4.2,<5",
    "matplotlib>=3.8,<4",
    "nbclient>=0.10,<1",
    "nbformat>=5.10,<6",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "python-chess>=1.999,<2",
    "python-docx>=1.1,<2",
    "python-pptx>=1.0,<2",
    "scikit-learn>=1.5,<2",
    "seaborn>=0.13,<1",
]

[tool.uv]
package = false
